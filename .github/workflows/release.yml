name: Release

# Manual, with an approval gate (configure a protected environment named "release").
# Currently packs and uploads the package as an artifact. Publishing to NuGet is intentionally
# left out until the package-id question is resolved: the id collides with the AWS Labs adapter
# (`Amazon.AuroraDsql.EntityFrameworkCore`). See docs/comparison-aurora-dsql-orms.md.
on:
  workflow_dispatch:

jobs:
  pack:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test (unit)
        run: dotnet test tests/Amazon.AuroraDsql.EntityFrameworkCore.Tests --no-build -c Release

      - name: Pack
        run: dotnet pack src/Amazon.AuroraDsql.EntityFrameworkCore -c Release -o artifacts

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: artifacts

      # Uncomment once the package id is resolved.
      # - name: Push to NuGet
      #   run: >
      #     dotnet nuget push artifacts/*.nupkg
      #     --api-key ${{ secrets.NUGET_API_KEY }}
      #     --source https://api.nuget.org/v3/index.json
